# ---------------------------------------------------------------------------
# Configuration of the mtDNA variant-calling workflow (see Snakefile / README.md)
# ---------------------------------------------------------------------------

# Sample names = FASTQ basenames: <sample>.fastq must exist next to the Snakefile.
# FreeBayes/Galaxy sample names use hyphens (Blood-PCR1); this is handled by the workflow.
samples:
  - Blood_PCR1
  - Blood_PCR2
  - Cheek_PCR1
  - Cheek_PCR2

# Reference genome (human mitochondrial genome, 16 569 bp)
reference: chrM.fasta

# Trimmomatic (single-end) - same settings as the Galaxy / course run
trimming:
  phred: 33
  steps: "SLIDINGWINDOW:4:20 MINLEN:20"

# FreeBayes - the course run used the defaults (diploid model, joint call on the 4 BAMs).
# Example of extra options: "--ploidy 1" (haploid model) or "--min-alternate-fraction 0.2"
freebayes:
  extra: ""

# Threads given to the multi-threaded tools (fastqc, trimmomatic, bwa mem, samtools sort)
threads: 4
